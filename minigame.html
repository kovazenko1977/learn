<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шериф: Быстрая Рука</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a2e;
            --primary: #4ecca3;
            --accent: #ff4d4d;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: transparent;
            font-family: 'Press Start 2P', cursive;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-widget {
            width: 350px;
            height: 550px;
            background: var(--bg-color);
            border: 4px solid #fff;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 15px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            border-bottom: 2px solid #fff;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-top: 10px;
        }

        #game-board {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
            background: #16213e;
        }

        .hole {
            background: #0f3460;
            border-radius: 50%;
            border: 3px solid #1a1a2e;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.5);
        }

        .bottle {
            width: 60%;
            position: absolute;
            bottom: -100%;
            left: 20%;
            transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .bottle.up {
            bottom: 15%;
        }

        .bottle img {
            width: 100%;
            pointer-events: none;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        h2 { font-size: 18px; margin-bottom: 20px; color: var(--primary); line-height: 1.4; }
        p { font-size: 10px; margin-bottom: 30px; line-height: 1.6; }

        .btn {
            background: var(--primary);
            border: none;
            padding: 15px 25px;
            color: #000;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 0 #2d9d78;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .score-popup {
            position: absolute;
            color: var(--primary);
            font-size: 12px;
            animation: floatUp 0.5s ease-out forwards;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        .sheriff-mini {
            width: 60px;
            position: absolute;
            bottom: 10px;
            right: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div id="game-widget">
    <header>
        <div style="font-size: 12px;">БЫСТРАЯ РУКА</div>
        <div class="stats">
            <div>ОЧКИ: <span id="score">0</span></div>
            <div>ВРЕМЯ: <span id="timer">30</span></div>
        </div>
    </header>

    <div id="game-board">
        <div class="hole"><div class="bottle"></div></div>
        <div class="hole"><div class="bottle"></div></div>
        <div class="hole"><div class="bottle"></div></div>
        <div class="hole"><div class="bottle"></div></div>
        <div class="hole"><div class="bottle"></div></div>
        <div class="hole"><div class="bottle"></div></div>
        <div class="hole"><div class="bottle"></div></div>
        <div class="hole"><div class="bottle"></div></div>
        <div class="hole"><div class="bottle"></div></div>
    </div>

    <img src="assets/dino.png" class="sheriff-mini" alt="Sheriff">

    <div id="overlay">
        <h2 id="msg-title">ГОТОВ К ДУЭЛИ?</h2>
        <p id="msg-body">Успей собрать как можно больше бутылок за 30 секунд!</p>
        <button class="btn" id="start-btn">В БОЙ!</button>
    </div>
</div>

<script>
    const holes = document.querySelectorAll('.hole');
    const bottles = document.querySelectorAll('.bottle');
    const scoreBoard = document.getElementById('score');
    const timerBoard = document.getElementById('timer');
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const msgTitle = document.getElementById('msg-title');
    const msgBody = document.getElementById('msg-body');

    let lastHole;
    let timeUp = false;
    let score = 0;
    let timeLeft = 30;
    let timerId;

    const bottleTypes = [
        'assets/bottle_lemon.png',
        'assets/bottle_pear.png',
        'assets/bottle_cherry.png'
    ];

    function randomTime(min, max) {
        return Math.round(Math.random() * (max - min) + min);
    }

    function randomHole(holes) {
        const idx = Math.floor(Math.random() * holes.length);
        const hole = holes[idx];
        if (hole === lastHole) return randomHole(holes);
        lastHole = hole;
        return hole;
    }

    function peep() {
        const time = randomTime(500, 1000);
        const hole = randomHole(holes);
        const bottleEl = hole.querySelector('.bottle');

        // Randomize bottle type
        const img = document.createElement('img');
        img.src = bottleTypes[Math.floor(Math.random() * bottleTypes.length)];
        bottleEl.innerHTML = '';
        bottleEl.appendChild(img);

        bottleEl.classList.add('up');

        setTimeout(() => {
            bottleEl.classList.remove('up');
            if (!timeUp) peep();
        }, time);
    }

    function startGame() {
        score = 0;
        timeLeft = 30;
        scoreBoard.textContent = 0;
        timerBoard.textContent = timeLeft;
        timeUp = false;
        overlay.style.display = 'none';

        peep();

        timerId = setInterval(() => {
            timeLeft--;
            timerBoard.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerId);
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        timeUp = true;
        overlay.style.display = 'flex';
        msgTitle.textContent = 'ВРЕМЯ ВЫШЛО!';
        msgBody.textContent = `Твой результат: ${score} очков. Неплохо для новичка!`;
        startBtn.textContent = 'ЕЩЕ РАЗ';
    }

    function bonk(e) {
        if (!e.isTrusted) return; // ignore fake clicks
        if (!this.classList.contains('up')) return;

        score += 100;
        this.classList.remove('up');
        scoreBoard.textContent = score;

        // Popup effect
        const rect = this.getBoundingClientRect();
        const popup = document.createElement('div');
        popup.className = 'score-popup';
        popup.textContent = '+100';
        popup.style.left = `${e.clientX - 20}px`;
        popup.style.top = `${e.clientY - 20}px`;
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 500);
    }

    bottles.forEach(bottle => bottle.addEventListener('click', bonk));
    startBtn.addEventListener('click', startGame);

</script>
</body>
</html>
