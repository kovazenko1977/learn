                    const currentOffsets = { ...prev.offsets };
                    if (elementKey === 'statsX') {
                        currentOffsets.statsX = Math.max(0, Math.min(60, (currentOffsets.statsX || 4) + deltaX));

                    } else if (elementKey === 'titleY') {
                        currentOffsets.titleY = Math.max(8, Math.min(40, (currentOffsets.titleY || 12) + deltaY));
                    } else if (elementKey === 'subtitleY') {
                        currentOffsets.subtitleY = Math.max(15, Math.min(55, (currentOffsets.subtitleY || 26) + deltaY));
                    } else if (elementKey === 'bodyY') {
                        currentOffsets.bodyY = Math.max(40, Math.min(95, (currentOffsets.bodyY || 52) + deltaY));
                    }
                    return { ...prev, offsets: currentOffsets };
                });
            };

            // EAN-13 Checksum calculator & validator
            const validateEAN13 = (code) => {
                if (!code || typeof code !== 'string') return false;
                const trimmed = code.trim();
                if (trimmed.length !== 13) return false;
                if (!/^\d{13}$/.test(trimmed)) return false;

                let sum = 0;
                for (let i = 0; i < 12; i++) {
                    const num = parseInt(trimmed[i], 10);
                    if (i % 2 === 0) {
                        sum += num;
                    } else {
                        sum += num * 3;
                    }
                }
                const calculatedChecksum = (10 - (sum % 10)) % 10;
                const givenChecksum = parseInt(trimmed[12], 10);
                return calculatedChecksum === givenChecksum;
            };

                } else {

                                                    >
                                                        <Icon name="cog" className="w-3.5 h-3.5" />
                                                        <span>Открыть</span>
                                                    </button>
                                                    <button
                                                        onClick={() => deleteTemplate(t.id)}
                                                        className="px-2 py-1 bg-red-100 hover:bg-red-200 text-red-700 rounded text-xs font-semibold"
                                                    >
                                                        <Icon name="trash" className="w-3.5 h-3.5" />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Print targets: exactly 2 per A4 portrait page */}
                    <div className="hidden print:block print-container">
                        <div className="print-label">
                            <LabelPreview data={form} />
                        </div>
                        <div className="print-label">
                            <LabelPreview data={form} />
                        </div>
                    </div>
                </div>
            );
        }

        // Dedicated interactive label renderer
        function LabelPreview({ data, onOffsetDrag, isInteractive = false }) {
            const barcodeRef = useRef(null);
            const qrcodeRef = useRef(null);
            const dragInfo = useRef({ active: false, elementKey: null, startX: 0, startY: 0 });

            // Redraw barcode and qr
            useEffect(() => {
                if (barcodeRef.current && data.barcode && data.barcode.trim().length === 13) {
                    try {
                        JsBarcode(barcodeRef.current, data.barcode, {
                            format: "EAN13",
                            width: 1.1,
                            height: 30,
                            displayValue: true,
                            font: "PT Sans Narrow",
                            fontSize: 10,
                            margin: 1
                        });
                    } catch (e) {
                        console.error(e);
                    }
                }
            }, [data.barcode]);

            useEffect(() => {
                if (qrcodeRef.current && data.qrCode) {
                    qrcodeRef.current.innerHTML = "";
                    try {
                        new QRCode(qrcodeRef.current, {
                            text: data.qrCode,
                            width: 38,
                            height: 38,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    } catch (e) {
                        console.error(e);
                    }
                }
            }, [data.qrCode]);

            // Drag event handlers
            const handleMouseDown = (e, elementKey) => {
                if (!isInteractive || !onOffsetDrag) return;
                e.preventDefault();
                dragInfo.current = {
                    active: true,
                    elementKey,
                    startX: e.clientX,
                    startY: e.clientY
                };
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
            };

            const handleMouseMove = (e) => {
                if (!dragInfo.current.active) return;
                const dx = (e.clientX - dragInfo.current.startX) / 3.779; // convert px to approximate mm
                const dy = (e.clientY - dragInfo.current.startY) / 3.779;
                if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                    onOffsetDrag(dragInfo.current.elementKey, dx, dy);
                    dragInfo.current.startX = e.clientX;
                    dragInfo.current.startY = e.clientY;
                }
            };

            const handleMouseUp = () => {
                dragInfo.current.active = false;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
            };

            const o = data.offsets || {
                headerY: 4,
                titleY: 12,
                subtitleY: 26,
                statsX: 4,
                iconsX: 178,
                bodyY: 52,
                bottomY: 130
            };

            return (
                <div className="label-preview-container select-none text-black relative border border-slate-300 bg-white">
                    {/* Brand header block */}
                    <div
                        style={{ top: `${o.headerY}mm` }}
                        onMouseDown={(e) => handleMouseDown(e, 'headerY')}
                        className={`absolute left-1/2 -translate-x-1/2 w-full text-center flex items-center justify-center space-x-1.5 ${isInteractive ? 'draggable-active' : ''}`}
                    >
                        {/* Circular Emblem matching the sample */}
                        <svg className="w-4 h-4 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 2v20M2 12h20M6 6l12 12M6 18L18 6" />
                        </svg>
                        <span className="font-bold text-[10px] tracking-[0.25em] font-narrow uppercase">{data.brandName || 'БРЕНД'}</span>
                    </div>

                    {/* Main Category (СИДР, ПИВО, ВИНО) */}
                    <div
                        style={{ top: `${o.titleY}mm` }}
                        onMouseDown={(e) => handleMouseDown(e, 'titleY')}
                        className={`absolute left-1/2 -translate-x-1/2 w-full text-center ${isInteractive ? 'draggable-active' : ''}`}
                    >
                        <h2 className="text-[34px] font-black tracking-[0.1em] leading-none font-narrow m-0 py-0 uppercase">
                            {data.productType || 'НАПИТОК'}
                        </h2>
                    </div>

                    {/* Description subtitling */}
                    <div
                        style={{ top: `${o.subtitleY}mm` }}
                        onMouseDown={(e) => handleMouseDown(e, 'subtitleY')}
                        className={`absolute left-1/2 -translate-x-1/2 w-[85%] text-center ${isInteractive ? 'draggable-active' : ''}`}
                    >
                        <p className="text-[8px] font-bold uppercase tracking-wide leading-tight text-center">
                            {data.subtitle || 'Описание напитка'}
                        </p>
                        <p className="text-[7.5px] font-bold text-center mt-0.5">
                            {data.standard} {data.tiNumber ? `| ${data.tiNumber}` : ''}
                        </p>
                    </div>

                    {/* Left Column Metric parameter block (СПИРТ, ОБЪЕМ, САХАР with divider lines matching sample) */}
                    <div
                        style={{ left: `${o.statsX}mm`, top: `${o.titleY - 2}mm` }}
                        onMouseDown={(e) => handleMouseDown(e, 'statsX')}
                        className={`absolute w-[34mm] flex flex-col font-narrow border-t border-black/30 pt-1 ${isInteractive ? 'draggable-active' : ''}`}
                    >
                        <div className="pb-1 border-b border-black/30">
                            <div className="text-[6.5px] font-bold uppercase tracking-wider text-slate-700 leading-none">СПИРТ</div>
                            <div className="text-[12px] font-black leading-tight mt-0.5">{data.alcohol || '0'}</div>
                        </div>
                        <div className="py-1 border-b border-black/30">
                            <div className="text-[6.5px] font-bold uppercase tracking-wider text-slate-700 leading-none">ОБЪЕМ</div>
                            <div className="text-[12px] font-black leading-tight mt-0.5">{data.volume || '0 л'}</div>
                        </div>
                        <div className="pt-1">
                            <div className="text-[6.5px] font-bold uppercase tracking-wider text-slate-700 leading-none">САХАР</div>
                            <div className="text-[12px] font-black leading-tight mt-0.5">{data.sugar || '0'}</div>
                        </div>
                    </div>

                    {/* Right compliance icons matching exact look of target image */}
                    <div
                        style={{ left: `${o.iconsX}mm`, top: `${o.headerY + 1}mm` }}
                        onMouseDown={(e) => handleMouseDown(e, 'iconsX')}
                        className={`absolute w-[26mm] flex flex-col items-center space-y-1.5 ${isInteractive ? 'draggable-active' : ''}`}
                    >
                        {data.qrCode && (
                            <div className="flex flex-col items-center">
                                <span className="text-[4.5px] font-bold tracking-tighter uppercase mb-0.5 font-sans">MADE IN BELARUS</span>
                                <div ref={qrcodeRef} className="p-0.5 bg-white border border-black/50 rounded shadow-sm"></div>
                            </div>
                        )}

                        {data.eacActive && (
                            <span className="font-bold text-[14px] tracking-tight border border-black/90 px-1 rounded font-mono leading-none">
                                EAC
                            </span>
                        )}

                        <div className="flex items-center space-x-1.5">
                            {data.foodActive && (
                                <svg className="w-4 h-4 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                                    <path d="M7 3v7a4 4 0 0 0 8 0V3M11 3v7" />
                                    <path d="M12 14v6M8 20h8" />
                                </svg>
                            )}

                            {data.petActive && (
                                <div className="flex flex-col items-center relative">
                                    <svg className="w-4 h-4 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                                        <path d="M12 2l8 14H4L12 2z" />
                                    </svg>
                                    <span className="text-[5.5px] font-black absolute top-1.5 font-mono">1</span>
                                    <span className="text-[4.5px] font-bold tracking-tighter font-mono uppercase">PET</span>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Standard regulations block */}
                    <div
                        style={{ top: `${o.bodyY}mm` }}
                        onMouseDown={(e) => handleMouseDown(e, 'bodyY')}
                        className={`absolute left-[3%] w-[94%] grid grid-cols-12 gap-3 ${isInteractive ? 'draggable-active' : ''}`}
                    >
                        <div className="col-span-8 flex flex-col space-y-0.5 font-narrow">
                            <p className="text-[6.5px] leading-[1.2] text-justify font-semibold">
                                {data.ingredients}
                            </p>
                            <p className="text-[6.5px] leading-[1.2] text-justify font-semibold text-slate-800">
                                {data.nutrition}
                            </p>
                            <p className="text-[6.5px] leading-[1.2] text-justify font-semibold text-slate-900">
                                {data.storage}
                            </p>
                            <p className="text-[7.2px] font-bold text-left tracking-wider pt-0.5 uppercase">
                                {data.expiration}
                            </p>
                        </div>

                        {/* Barcode and manual dates */}
                        <div className="col-span-4 flex flex-col items-end space-y-1 pr-1">
                            {data.barcode && (
                                <div className="flex justify-end">
                                    <svg ref={barcodeRef}></svg>
                                </div>
                            )}

                            <div className="w-full pl-3 space-y-0.5 font-narrow">
                                <div className="flex justify-between items-center text-[7px] border-b border-black/40 pb-px">
                                    <span className="font-bold">Дата розлива</span>
                                    <span className="w-14 border-b border-black h-1.5"></span>
                                </div>
                                <div className="flex justify-between items-center text-[7px] border-b border-black/40 pb-px">
                                    <span className="font-bold">Дата подключения</span>
                                    <span className="w-14 border-b border-black h-1.5"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Legal Warning Banner Block */}
                    <div
                        style={{
                            height: `${data.warningHeightPercent}%`,
                            top: `${100 - data.warningHeightPercent}%`
                        }}
                        className="absolute left-0 w-full bg-white border-t-2 border-black flex items-center justify-center px-4"
                    >
                        <h4 className="text-[9.5px] font-black tracking-wider leading-none text-center uppercase text-black font-narrow">
                            {data.warningText || 'ЧРЕЗМЕРНОЕ УПОТРЕБЛЕНИЕ АЛКОГОЛЯ ВРЕДИТ ВАШЕМУ ЗДОРОВЬЮ'}
                        </h4>
                    </div>
                </div>
            );
        }

        // Render React application
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
