<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Супер Кактус Шериф</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <div class="stat-box">
                <span class="label">ОЧКИ</span>
                <span id="score">000000</span>
            </div>
            <div class="stat-box">
                <span class="label">МОНЕТЫ</span>
                <span id="coins">x00</span>
            </div>
            <div class="stat-box">
                <span class="label">МИР</span>
                <span>1-1</span>
            </div>
        </header>

        <main class="game-world">
            <div class="clouds"></div>
            <div class="character-container" id="character-container">
                <img src="assets/character.png" alt="Кактус Шериф" id="character-img">
            </div>
            <div class="interaction-block" id="block">
                <div class="block-inner">?</div>
            </div>
        </main>

        <footer class="game-footer">
            <div class="ground"></div>
            <div class="controls">
                <button id="action-btn">ПРЫЖОК</button>
                <button id="auto-btn">АВТО-ИГРА</button>
            </div>
            <div id="event-log" class="event-message">ГОТОВ К ПРИКЛЮЧЕНИЯМ!</div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
