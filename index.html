<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чиназес Марио Дино</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container" id="game-container">
        <header class="game-header">
            <div class="stat-box">
                <span class="label">ОЧКИ</span>
                <span id="score">000000</span>
            </div>
            <div class="stat-box">
                <span class="label">БУТЫЛКИ</span>
                <span id="bottles">x00</span>
            </div>
            <div class="stat-box">
                <span class="label">РЕКОРД</span>
                <span id="highscore">000000</span>
            </div>
        </header>

        <main class="game-world" id="game-world">
            <div class="scrolling-background" id="background"></div>
            <div class="ground-container" id="ground">
                <div class="ground-part"></div>
                <div class="ground-part"></div>
            </div>
            <div class="character running" id="player">
                <img src="assets/character.png" alt="Дино">
            </div>
        </main>

        <div class="controls">
            <button class="jump-btn" id="jump-btn">ПРЫЖОК</button>
        </div>

        <div class="overlay" id="game-over">
            <h2>ИГРА ОКОНЧЕНА</h2>
            <p id="final-score">СЧЕТ: 0</p>
            <button class="restart-btn" id="restart-btn">ИГРАТЬ СНОВА</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
