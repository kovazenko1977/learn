<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Спецакция: Ремонт АКПП</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff2a2a;
      --primary-glow: rgba(255, 42, 42, 0.6);
      --secondary: #ffb703;
      --accent-blue: #00f0ff;
      --bg-dark: #0b0f19;
      --card-bg: rgba(20, 27, 45, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 16px;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255, 42, 42, 0.22) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(20, 27, 45, 0.95) 0%, #0b0f19 100%);
    }

    /* Background animated gears */
    .bg-gear {
      position: absolute;
      opacity: 0.05;
      pointer-events: none;
      animation: rotateGear 40s linear infinite;
      z-index: 0;
    }

    .bg-gear-1 {
      top: -80px;
      left: -80px;
      width: 320px;
      height: 320px;
    }

    .bg-gear-2 {
      bottom: -100px;
      right: -80px;
      width: 400px;
      height: 400px;
      animation-direction: reverse;
      animation-duration: 55s;
    }

    @keyframes rotateGear {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Container */
    .banner-container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* Minimalist Header */
    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 10px 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: 1px;
      color: #fff;
      text-transform: uppercase;
    }

    .brand-logo span {
      color: var(--primary);
    }

    .brand-logo svg {
      width: 28px;
      height: 28px;
      fill: var(--primary);
      filter: drop-shadow(0 0 6px var(--primary));
    }

    /* Hero Banner Box */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 32px 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    /* Light Sweep Effect */
    .hero-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 45%,
        rgba(255, 255, 255, 0.035) 50%,
        transparent 55%
      );
      animation: sweep 7s infinite linear;
      pointer-events: none;
    }

    @keyframes sweep {
      0% { transform: translate(-30%, -30%); }
      100% { transform: translate(30%, 30%); }
    }

    /* Offer Badge */
    .urgency-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #ff2a2a, #ff7b00);
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      box-shadow: 0 4px 18px var(--primary-glow);
      margin-bottom: 20px;
      animation: badgePulse 1.8s infinite alternate;
    }

    @keyframes badgePulse {
      0% { transform: scale(1); box-shadow: 0 4px 12px var(--primary-glow); }
      100% { transform: scale(1.04); box-shadow: 0 6px 25px rgba(255, 42, 42, 0.85); }
    }

    .urgency-badge .dot {
      width: 8px;
      height: 8px;
      background-color: #fff;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Main Title */
    .main-title {
      font-size: clamp(1.5rem, 5.5vw, 2.4rem);
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 50%, #ff2a2a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: -0.3px;
    }

    .main-title .highlight {
      background: linear-gradient(90deg, #ffb703, #ff2a2a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(0.92rem, 3vw, 1.1rem);
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Timer Box */
    .timer-section {
      background: rgba(10, 14, 26, 0.92);
      border: 1.5px solid rgba(255, 42, 42, 0.4);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 42, 42, 0.12);
      text-align: center;
    }

    .timer-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .timer-title svg {
      color: var(--secondary);
    }

    .countdown-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
    }

    .time-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-box {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2.6rem, 9vw, 3.8rem);
      font-weight: 900;
      background: linear-gradient(180deg, #1f273d 0%, #111625 100%);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 14px;
      min-width: 85px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), 0 0 12px rgba(0, 240, 255, 0.18);
    }

    .time-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    .time-separator {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 800;
      color: var(--primary);
      animation: blink 1s infinite;
      margin-top: -18px;
    }

    .timer-footnote {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 18px;
      font-weight: 600;
      line-height: 1.4;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .hero-card {
        padding: 24px 16px;
      }
      .time-box {
        min-width: 70px;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Animated Gears -->
  <svg class="bg-gear bg-gear-1" viewBox="0 0 100 100">
    <path fill="#ffffff" d="M50 35c-8.3 0-15 6.7-15 15s6.7 15 15 15 15-6.7 15-15-6.7-15-15-15zm38 12.5l-6.8-1.1c-.6-2.5-1.6-4.9-2.9-7.1l4.1-5.5c.8-1.1.7-2.6-.2-3.5l-5.7-5.7c-.9-.9-2.4-1-3.5-.2l-5.5 4.1c-2.2-1.3-4.6-2.3-7.1-2.9L59 18.8C58.8 17.3 57.5 16 56 16h-8c-1.5 0-2.8 1.3-3 2.8l-1.1 6.8c-2.5.6-4.9 1.6-7.1 2.9l-5.5-4.1c-1.1-.8-2.6-.7-3.5.2l-5.7 5.7c-.9.9-1 2.4-.2 3.5l4.1 5.5c-1.3 2.2-2.3 4.6-2.9 7.1L16.2 47.5C14.7 47.7 13.5 49 13.5 50.5v8c0 1.5 1.2 2.8 2.7 3l6.8 1.1c.6 2.5 1.6 4.9 2.9 7.1l-4.1 5.5c-.8 1.1-.7 2.6.2 3.5l5.7 5.7c.9.9 2.4 1 3.5.2l5.5-4.1c2.2 1.3 4.6 2.3 7.1 2.9l1.1 6.8c.2 1.5 1.5 2.8 3 2.8h8c1.5 0 2.8-1.3 3-2.8l1.1-6.8c2.5-.6 4.9-1.6 7.1-2.9l5.5 4.1c1.1.8 2.6.7 3.5-.2l5.7-5.7c.9-.9 1-2.4.2-3.5l-4.1-5.5c1.3-2.2 2.3-4.6 2.9-7.1l6.8-1.1c1.5-.2 2.8-1.5 2.8-3v-8c0-1.5-1.3-2.8-2.8-3z"/>
  </svg>
  <svg class="bg-gear bg-gear-2" viewBox="0 0 100 100">
    <path fill="#ffffff" d="M50 35c-8.3 0-15 6.7-15 15s6.7 15 15 15 15-6.7 15-15-6.7-15-15-15zm38 12.5l-6.8-1.1c-.6-2.5-1.6-4.9-2.9-7.1l4.1-5.5c.8-1.1.7-2.6-.2-3.5l-5.7-5.7c-.9-.9-2.4-1-3.5-.2l-5.5 4.1c-2.2-1.3-4.6-2.3-7.1-2.9L59 18.8C58.8 17.3 57.5 16 56 16h-8c-1.5 0-2.8 1.3-3 2.8l-1.1 6.8c-2.5.6-4.9 1.6-7.1 2.9l-5.5-4.1c-1.1-.8-2.6-.7-3.5.2l-5.7 5.7c-.9.9-1 2.4-.2 3.5l4.1 5.5c-1.3 2.2-2.3 4.6-2.9 7.1L16.2 47.5C14.7 47.7 13.5 49 13.5 50.5v8c0 1.5 1.2 2.8 2.7 3l6.8 1.1c.6 2.5 1.6 4.9 2.9 7.1l-4.1 5.5c-.8 1.1-.7 2.6.2 3.5l5.7 5.7c.9.9 2.4 1 3.5.2l5.5-4.1c2.2 1.3 4.6 2.3 7.1 2.9l1.1 6.8c.2 1.5 1.5 2.8 3 2.8h8c1.5 0 2.8-1.3 3-2.8l1.1-6.8c2.5-.6 4.9-1.6 7.1-2.9l5.5 4.1c1.1.8 2.6.7 3.5-.2l5.7-5.7c.9-.9 1-2.4.2-3.5l-4.1-5.5c1.3-2.2 2.3-4.6 2.9-7.1l6.8-1.1c1.5-.2 2.8-1.5 2.8-3v-8c0-1.5-1.3-2.8-2.8-3z"/>
  </svg>

  <div class="banner-container">
    <!-- Header -->
    <header class="top-bar">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        АКПП<span>-ПРОФИ</span>
      </div>
    </header>

    <!-- Main Hero Banner -->
    <main class="hero-card">
      <div class="urgency-badge">
        <span class="dot"></span> Ограниченное предложение
      </div>

      <h1 class="main-title">
        На сегодняшний момент самый доступный ремонт вашей <span class="highlight">АКПП!</span>
      </h1>

      <p class="subtitle">
        Спецакция на диагностику и запасные части действует до завершения таймера!
      </p>

      <!-- Countdown Timer -->
      <div class="timer-section">
        <div class="timer-title">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          До окончания акции осталось:
        </div>

        <div class="countdown-display" id="countdown">
          <div class="time-unit">
            <div class="time-box" id="minutes">20</div>
            <div class="time-label">минут</div>
          </div>
          <div class="time-separator">:</div>
          <div class="time-unit">
            <div class="time-box" id="seconds">00</div>
            <div class="time-label">секунд</div>
          </div>
        </div>

        <p class="timer-footnote">⏱️ Успейте воспользоваться спецпредложением!</p>
      </div>
    </main>
  </div>

  <script>
    // 20-minute countdown logic (MM:SS)
    const DURATION_MINUTES = 20;
    const totalMs = DURATION_MINUTES * 60 * 1000;

    const savedEndTime = localStorage.getItem('akpp_offer_end_time');
    const now = Date.now();

    let endTime;
    if (savedEndTime && parseInt(savedEndTime) > now) {
      endTime = parseInt(savedEndTime);
    } else {
      endTime = now + totalMs;
      localStorage.setItem('akpp_offer_end_time', endTime);
    }

    const minEl = document.getElementById('minutes');
    const secEl = document.getElementById('seconds');

    function updateTimer() {
      const currentTime = Date.now();
      const remaining = endTime - currentTime;

      if (remaining <= 0) {
        minEl.textContent = '00';
        secEl.textContent = '00';
        return;
      }

      const minutes = Math.floor((remaining / (1000 * 60)) % 60);
      const seconds = Math.floor((remaining / 1000) % 60);

      minEl.textContent = minutes.toString().padStart(2, '0');
      secEl.textContent = seconds.toString().padStart(2, '0');
    }

    setInterval(updateTimer, 500);
    updateTimer();
  </script>
</body>
</html>
