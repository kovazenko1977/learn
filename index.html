                    return updated;
                });
            };

                setForm(prev => {
                    const newOffsets = { ...prev.offsets, [key]: parseFloat(val) };
                    return { ...prev, offsets: newOffsets };
                });
            };

            // EAN-13 Checksum calculator & validator
            const validateEAN13 = (code) => {
                if (!code || typeof code !== 'string') return false;
                const trimmed = code.trim();
                if (trimmed.length !== 13) return false;
                if (!/^\d{13}$/.test(trimmed)) return false;

                let sum = 0;
                for (let i = 0; i < 12; i++) {
                    const num = parseInt(trimmed[i], 10);
                    if (i % 2 === 0) {
                        sum += num;
                    } else {
                        sum += num * 3;
                    }
                }
                const calculatedChecksum = (10 - (sum % 10)) % 10;
                const givenChecksum = parseInt(trimmed[12], 10);
                return calculatedChecksum === givenChecksum;
            };

            // Compliance validation rules
            const verifyCompliance = (data) => {
                const reports = [];
                let score = 100;

                // 1. Warning banner height
                const isWarningSizeValid = data.warningHeightPercent >= 10;
                if (!isWarningSizeValid) {
                    score -= 30;
                    reports.push({
                        status: 'error',
                        text: `Предупреждающая надпись занимает ${data.warningHeightPercent}%. По законам РБ (Закон о рекламе, СанПиН) площадь должна быть не менее 10% от всей площади этикетки!`
                    });
                } else {
                    reports.push({
                        status: 'success',
                        text: `Предупреждающая надпись занимает ${data.warningHeightPercent}%. Соответствует норме (не менее 10%).`
                    });
                }

                const cleanedWarning = data.warningText ? data.warningText.toUpperCase().trim() : '';

                    score -= 20;
                    reports.push({
                        status: 'error',
                        text: `Текст предупреждения должен быть точно: "${exactPhrase}". Обнаружен измененный текст.`

                    reports.push({
                        status: 'success',
                        text: 'Предупреждающий текст соответствует регламенту Министерства здравоохранения РБ.'
                    });
                }

                if (!data.eacActive) {
                    score -= 20;
                    reports.push({

                    });
                } else {
                    reports.push({
                        status: 'success',
                        text: 'Знак EAC включен (соответствие ТР ТС 022/2011, ТР ТС 021/2011).'
                    });
                }

                // 4. Food Contact + Eco mark

                    reports.push({
                        status: 'warning',
                        text: 'Отсутствует знак контакта с пищевыми продуктами (бокал и вилка). ТР ТС 005/2011 "О безопасности упаковки".'
                    });

                    reports.push({
                        status: 'success',
                        text: 'Знак "Пищевой пластик/Стекло" (бокал-вилка) включен.'
                    });
                }

                // 5. Standard referenced
                const standardDefined = data.standard && data.standard.trim().length > 3;

                        text: `Производится по действующему нормативному стандарту: ${data.standard}.`
                    });
                }

                        reports.push({

                            text: 'Штрих-код EAN-13 прошел валидацию контрольной суммы.'
                        });
                    }

                        text: 'Штрих-код не указан. Обязателен для продажи в розничных сетях Республики Беларусь.'

                    reports.push({

                                                    <span>Знак EAC</span>
                                                </label>
                                                <label className="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer">
                                                    <input
                                                        type="checkbox"
                                                        checked={form.foodActive}
                                                        onChange={(e) => handleFieldChange('foodActive', e.target.checked)}
                                                        className="rounded text-brand-600 focus:ring-brand-500 w-4 h-4"
                                                    />
                                                    <span>Пищевой знак</span>
                                                </label>
                                                <label className="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer">
                                                    <input
                                                        type="checkbox"
                                                        checked={form.petActive}
                                                        onChange={(e) => handleFieldChange('petActive', e.target.checked)}
                                                        className="rounded text-brand-600 focus:ring-brand-500 w-4 h-4"
                                                    />
                                                    <span>Знак ПЭТ 01</span>
                                                </label>
                                            </div>
                                        </div>

                                        {/* Canvas Position Sliders (visible only if isFreeform is active) */}
                                        {isFreeform && (
                                            <div className="bg-amber-50/50 p-3 rounded-lg border border-amber-200 space-y-3">
                                                <h4 className="text-xs font-bold text-amber-800 uppercase tracking-wider flex items-center space-x-1">
                                                    <Icon name="move" className="w-4 h-4" />
                                                    <span>Свободное позиционирование элементов</span>
                                                </h4>
                                                <div className="grid grid-cols-2 gap-3 text-xs">
                                                    <div>
                                                        <label className="block text-slate-600 font-medium mb-1">Высота шапки бренда (Y)</label>
                                                        <input
                                                            type="range" min="0" max="20" step="1"
                                                            value={form.offsets?.headerY || 4}
                                                            onChange={(e) => handleOffsetChange('headerY', e.target.value)}
                                                            className="w-full accent-amber-600"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-slate-600 font-medium mb-1">Высота ТИП напитка (Y)</label>
                                                        <input
                                                            type="range" min="10" max="25" step="1"
                                                            value={form.offsets?.titleY || 15}
                                                            onChange={(e) => handleOffsetChange('titleY', e.target.value)}
                                                            className="w-full accent-amber-600"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-slate-600 font-medium mb-1">Высота Названия/СТБ (Y)</label>
                                                        <input
                                                            type="range" min="20" max="45" step="1"
                                                            value={form.offsets?.subtitleY || 30}
                                                            onChange={(e) => handleOffsetChange('subtitleY', e.target.value)}
                                                            className="w-full accent-amber-600"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-slate-600 font-medium mb-1">Отступ показателей (X)</label>
                                                        <input
                                                            type="range" min="2" max="25" step="1"
                                                            value={form.offsets?.statsX || 4}
                                                            onChange={(e) => handleOffsetChange('statsX', e.target.value)}
                                                            className="w-full accent-amber-600"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-slate-600 font-medium mb-1">Отступ значков/EAC (X)</label>
                                                        <input
                                                            type="range" min="150" max="200" step="2"
                                                            value={form.offsets?.iconsX || 180}
                                                            onChange={(e) => handleOffsetChange('iconsX', e.target.value)}
                                                            className="w-full accent-amber-600"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-slate-600 font-medium mb-1">Высота состава/текста (Y)</label>
                                                        <input
                                                            type="range" min="45" max="80" step="2"
                                                            value={form.offsets?.bodyY || 55}
                                                            onChange={(e) => handleOffsetChange('bodyY', e.target.value)}
                                                            className="w-full accent-amber-600"
                                                        />
                                                    </div>
                                                </div>
                                                <div className="flex justify-end">
                                                    <button
                                                        onClick={() => handleFieldChange('offsets', { ...PRESETS[0].offsets })}
                                                        className="px-2 py-1 bg-white border border-amber-300 rounded text-amber-800 font-bold hover:bg-amber-100 transition"
                                                    >
                                                        Сбросить сдвиги
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Footer Save & Export Section */}
                                    <div className="p-4 border-t border-slate-200 bg-slate-50/70 rounded-b-xl flex flex-col space-y-3">
                                        <div className="flex space-y-2 sm:space-y-0 sm:space-x-2 flex-col sm:flex-row">
                                            <input
                                                type="text"
                                                placeholder="Название нового шаблона..."
                                                value={customName}
                                                onChange={(e) => setCustomName(e.target.value)}
                                                className="flex-1 text-xs border border-slate-300 rounded-lg p-2 focus:ring-1 focus:ring-brand-500 bg-white font-medium"
                                            />
                                            <button
                                                onClick={saveTemplate}
                                                className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-lg text-xs transition flex items-center justify-center space-x-1.5 shadow"
                                            >
                                                <Icon name="save" className="w-4 h-4" />
                                                <span>Сохранить в базу</span>
                                            </button>
                                        </div>

                                        <div className="flex justify-between items-center pt-2 border-t border-slate-200/50">
                                            <button
                                                onClick={exportTemplates}
                                                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg text-slate-700 font-semibold text-xs transition flex items-center space-x-1"
                                            >
                                                <Icon name="download" className="w-3.5 h-3.5" />
                                                <span>Экспорт JSON</span>
                                            </button>

                                            <label className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg text-slate-700 font-semibold text-xs transition flex items-center space-x-1 cursor-pointer">
                                                <Icon name="upload" className="w-3.5 h-3.5" />
                                                <span>Импорт JSON</span>
                                                <input
                                                    type="file"
                                                    accept=".json"
                                                    onChange={handleImport}
                                                    className="hidden"
                                                />
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}

                        {activeTab === 'templates' && (
                            <div className="col-span-12 bg-white rounded-xl shadow-md p-6 border border-slate-200">
                                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center space-x-2">
                                    <Icon name="fileText" className="w-5 h-5 text-brand-600" />
                                    <span>Ваши сохраненные шаблоны</span>
                                </h3>

                                {savedTemplates.length === 0 ? (
                                    <div className="text-center py-12 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50">
                                        <p className="text-slate-500 font-medium">У вас пока нет сохраненных шаблонов.</p>
                                        <p className="text-xs text-slate-400 mt-1">Создайте и настройте этикетку в конструкторе, введите имя и нажмите "Сохранить в базу".</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {savedTemplates.map((t) => (
                                            <div key={t.id} className="p-4 border border-slate-200 rounded-xl hover:shadow-md transition bg-slate-50 flex flex-col justify-between">
                                                <div>
                                                    <div className="flex justify-between items-start mb-2">
                                                        <h4 className="font-bold text-slate-800 truncate pr-2">{t.name}</h4>
                                                        <span className="text-[10px] bg-brand-100 text-brand-800 px-2 py-0.5 rounded-full font-bold">
                                                            {t.productType}
                                                        </span>
                                                    </div>
                                                    <p className="text-xs text-slate-500 mb-1 font-semibold truncate">{t.subtitle}</p>
                                                    <p className="text-xs text-slate-400">Крепость: {t.alcohol}% об. | Сахар: {t.sugar} г/л</p>
                                                </div>
                                                <div className="flex justify-end space-x-2 mt-4 pt-3 border-t border-slate-200/60">
                                                    <button
                                                        onClick={() => {
                                                            setForm({ ...t });
                                                            setActiveTab('editor');
                                                        }}
                                                        className="px-3 py-1 bg-brand-600 hover:bg-brand-700 text-white rounded text-xs font-bold transition flex items-center space-x-1"
                                                    >
                                                        <Icon name="cog" className="w-3.5 h-3.5" />
                                                        <span>Открыть</span>
                                                    </button>
                                                    <button
                                                        onClick={() => deleteTemplate(t.id)}
                                                        className="px-2 py-1 bg-red-100 hover:bg-red-200 text-red-700 rounded text-xs font-semibold transition flex items-center"
                                                    >
                                                        <Icon name="trash" className="w-3.5 h-3.5" />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Dynamic print-only target layout: Prints 2 A5 landscape labels on A4 portrait page */}
                    <div className="hidden print:block print-container">
                        <div className="print-label">
                            <LabelPreview data={form} isPrinting={true} />
                        </div>
                        <div className="print-label">
                            <LabelPreview data={form} isPrinting={true} />
                        </div>
                    </div>
                </div>
            );
        }

        // Dedicated Label Renderer (A5 Landscape: 210mm x 148mm)
        function LabelPreview({ data, isPrinting = false }) {
            const barcodeRef = useRef(null);
            const qrcodeRef = useRef(null);

            // Redraw barcode and qr elements dynamically when properties change
            useEffect(() => {
                if (barcodeRef.current && data.barcode && data.barcode.trim().length === 13) {
                    try {
                        JsBarcode(barcodeRef.current, data.barcode, {
                            format: "EAN13",
                            width: 1.1,
                            height: 32,
                            displayValue: true,
                            font: "PT Sans Narrow",
                            fontSize: 10,
                            margin: 2
                        });
                    } catch (err) {
                        console.error('Barcode draw error:', err);
                    }
                }
            }, [data.barcode]);

            useEffect(() => {
                if (qrcodeRef.current && data.qrCode) {
                    qrcodeRef.current.innerHTML = "";
                    try {
                        new QRCode(qrcodeRef.current, {
                            text: data.qrCode,
                            width: 48,
                            height: 48,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    } catch (err) {
                        console.error('QR draw error:', err);
                    }
                }
            }, [data.qrCode]);

            // Custom inline styles to handle dynamic layout adjustments
            const o = data.offsets || {
                headerY: 4,
                titleY: 15,
                subtitleY: 30,
                statsX: 4,
                iconsX: 180,
                bodyY: 55,
                bottomY: 130
            };

            return (
                <div className="label-preview-container select-none text-black relative border border-slate-300">
                    {/* Header brand name */}
                    <div
                        style={{ top: `${o.headerY}mm` }}
                        className="absolute left-1/2 -translate-x-1/2 w-full text-center flex items-center justify-center space-x-1.5"
                    >
                        {/* Circular Minsk Crystal Logo Pattern */}
                        <svg className="w-5 h-5 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 2v20M2 12h20M12 6l6 6-6 6-6-6 6-6z" />
                        </svg>
                        <span className="font-bold text-[10px] tracking-widest font-narrow uppercase">{data.brandName || 'БРЕНД'}</span>
                    </div>

                    {/* Main beverage title (e.g. СИДР, ПИВО, ВИНО) */}
                    <div
                        style={{ top: `${o.titleY}mm` }}
                        className="absolute left-1/2 -translate-x-1/2 w-full text-center"
                    >
                        <h2 className="text-[28px] font-black tracking-widest leading-none font-narrow m-0 py-0 uppercase">
                            {data.productType || 'НАПИТОК'}
                        </h2>
                    </div>

                    {/* Specific dynamic beverage info */}
                    <div
                        style={{ top: `${o.subtitleY}mm` }}
                        className="absolute left-1/2 -translate-x-1/2 w-[85%] text-center px-4"
                    >
                        <p className="text-[9px] font-bold uppercase tracking-wide leading-tight text-center">
                            {data.subtitle || 'Описание напитка'}
                        </p>
                        <p className="text-[8px] font-bold text-center mt-1">
                            {data.standard} {data.tiNumber ? `| ${data.tiNumber}` : ''}
                        </p>
                    </div>

                    {/* Left Column Metric parameters: ALCOHOL, VOLUME, SUGAR */}
                    <div
                        style={{ left: `${o.statsX}mm`, top: `${o.titleY}mm` }}
                        className="absolute w-[36mm] flex flex-col space-y-1.5 font-narrow"
                    >
                        <div>
                            <div className="text-[8px] font-bold uppercase tracking-wider text-slate-500 leading-none">СПИРТ</div>
                            <div className="text-[14px] font-bold leading-tight">{data.alcohol || '0'} % об.</div>
                        </div>
                        <div>
                            <div className="text-[8px] font-bold uppercase tracking-wider text-slate-500 leading-none">ОБЪЕМ</div>
                            <div className="text-[14px] font-bold leading-tight">{data.volume || '0 л'}</div>
                        </div>
                        <div>
                            <div className="text-[8px] font-bold uppercase tracking-wider text-slate-500 leading-none">САХАР</div>
                            <div className="text-[14px] font-bold leading-tight">{data.sugar || '0'} г/л</div>
                        </div>
                    </div>

                    {/* Right Column Compliance Symbols & QR Code */}
                    <div
                        style={{ left: `${o.iconsX}mm`, top: `${o.headerY + 2}mm` }}
                        className="absolute w-[24mm] flex flex-col items-center space-y-2.5"
                    >
                        {/* Made In Belarus label above QR */}
                        {data.qrCode && (
                            <div className="flex flex-col items-center">
                                <span className="text-[5px] font-bold tracking-tighter uppercase whitespace-nowrap mb-0.5">MADE IN BELARUS</span>
                                <div ref={qrcodeRef} className="p-0.5 bg-white border border-black/40 rounded shadow-sm"></div>
                            </div>
                        )}

                        {/* EAC Logo */}
                        {data.eacActive && (
                            <span className="font-bold text-[13px] tracking-tight border border-black px-1 py-px rounded font-mono leading-none">
                                EAC
                            </span>
                        )}

                        {/* Custom Vector Logos */}
                        <div className="flex items-center space-x-2">
                            {/* Food contact (Glass & Fork) Symbol */}
                            {data.foodActive && (
                                <svg className="w-5 h-5 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                                    <path d="M7 3v7a4 4 0 0 0 8 0V3M11 3v7" />
                                    <path d="M12 14v6M8 20h8" />
                                </svg>
                            )}

                            {/* Eco material recycling loop (PET 01) symbol */}
                            {data.petActive && (
                                <div className="flex flex-col items-center relative">
                                    <svg className="w-5 h-5 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                                        <path d="M12 2l8 14H4L12 2z" />
                                    </svg>
                                    <span className="text-[6px] font-black absolute top-1.5 font-mono">1</span>
                                    <span className="text-[5px] font-bold tracking-tighter font-mono uppercase mt-0.5">PET</span>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Main Technical Regulations Composition Block */}
                    <div
                        style={{ top: `${o.bodyY}mm` }}
                        className="absolute left-[3.5%] w-[93%] grid grid-cols-12 gap-3"
                    >
                        <div className="col-span-8 flex flex-col space-y-1">
                            <p className="text-[6.8px] leading-[1.25] text-justify font-medium">
                                <span className="font-bold">{data.ingredients}</span>
                            </p>
                            <p className="text-[6.8px] leading-[1.2] text-justify font-medium">
                                <span className="text-slate-700">{data.nutrition}</span>
                            </p>
                            <p className="text-[6.8px] leading-[1.2] text-justify font-medium">
                                <span className="text-slate-800">{data.storage}</span>
                            </p>
                            <p className="text-[7.2px] font-bold text-left tracking-wide pt-0.5 uppercase">
                                {data.expiration}
                            </p>
                            <p className="text-[6.5px] leading-[1.2] text-justify pt-0.5 text-slate-800">
                                Изготовитель: <span className="font-bold">{data.manufacturerName}</span>, {data.manufacturerAddress}. {data.manufacturerContact}
                            </p>
                        </div>

                        {/* Barcode and manual entry dates section */}
                        <div className="col-span-4 flex flex-col items-end space-y-1.5 pt-1">
                            {data.barcode && (
                                <div className="flex justify-end pr-1">
                                    <svg ref={barcodeRef}></svg>
                                </div>
                            )}

                            {/* Standard manual fields with bottom underscores */}
                            <div className="w-[100%] pl-2 space-y-1 pr-1 font-narrow">
                                <div className="flex justify-between items-center text-[7.5px] border-b border-black/40 pb-px">
                                    <span className="font-bold">Дата розлива:</span>
                                    <span className="w-16 border-b border-black h-2"></span>
                                </div>
                                <div className="flex justify-between items-center text-[7.5px] border-b border-black/40 pb-px">
                                    <span className="font-bold">Дата подключения:</span>
                                    <span className="w-16 border-b border-black h-2"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Legal Warning Banner Block (occupies at least 10% bottom area of A5) */}
                    <div
                        style={{
                            height: `${data.warningHeightPercent}%`,
                            top: `${100 - data.warningHeightPercent}%`
                        }}
                        className="absolute left-0 w-full bg-white border-t-2 border-black flex items-center justify-center px-4"
                    >
                        <h4 className="text-[10px] md:text-[11px] font-black tracking-wider leading-none text-center uppercase text-black font-narrow">
                            {data.warningText || 'ЧРЕЗМЕРНОЕ УПОТРЕБЛЕНИЕ АЛКОГОЛЯ ВРЕДИТ ВАШЕМУ ЗДОРОВЬЮ'}
                        </h4>
                    </div>
                </div>
            );
        }

        // Render React Application
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
