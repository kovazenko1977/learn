<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чиназес Хватайка</title>
    <style>
        :root {
            --machine-border: #444;
            --machine-bg: #222;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --lemon: #ffff00;
            --pear: #32cd32;
            --cherry: #ff0000;
            --empty: #808080;
            --sheriff-body: #4CAF50;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            background: #87CEEB;
            overflow: hidden;
            border-left: 10px solid var(--machine-border);
            border-right: 10px solid var(--machine-border);
            box-sizing: border-box;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: radial-gradient(circle, rgba(44, 62, 80, 0.95), rgba(0, 0, 0, 0.98));
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .screen h1 {
            font-size: 3rem;
            margin-top: 0;
            animation: titlePulse 2s infinite ease-in-out;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .flavor-guide {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .flavor-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
        }

        .flavor-icon {
            width: 20px;
            height: 40px;
            background-size: contain;
            background-repeat: no-repeat;
            margin-bottom: 5px;
        }

        h1 { color: #f1c40f; text-shadow: 2px 2px #d35400; font-size: 2.5rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; margin-bottom: 2rem; }

        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px #a04000;
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px #a04000;
        }

        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
            background: #2c3e50;
            background-image:
                radial-gradient(#34495e 20%, transparent 20%),
                radial-gradient(#34495e 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            z-index: 1;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 5%;
            width: 90%;
            display: flex;
            justify-content: space-around;
            color: #2ecc71; /* LCD Green */
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 0;
            border-radius: 5px;
            border: 2px solid #555;
            font-size: 0.9rem;
            z-index: 50;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 10px rgba(0,255,0,0.2);
        }

        .timer-low {
            color: #e74c3c !important;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #machine-area {
            position: absolute;
            top: 50px;
            bottom: 140px;
            left: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 8px solid #333;
            border-bottom-width: 20px;
            border-radius: 10px 10px 0 0;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        .point-popup {
            position: absolute;
            color: #f1c40f;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: popup 1s forwards;
            z-index: 60;
            text-shadow: 2px 2px #000;
        }

        @keyframes popup {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        /* Claw Logic */
        #claw-carriage {
            position: absolute;
            top: 0;
            left: 50%;
            width: 60px;
            height: 30px;
            background: linear-gradient(to bottom, #777, #333);
            transform: translateX(-50%);
            z-index: 30;
            border-bottom: 3px solid #222;
            border-radius: 4px;
        }

        #claw-rope {
            position: absolute;
            top: 30px;
            left: 50%;
            width: 4px;
            height: 0;
            background: linear-gradient(to right, #999, #555);
            transform: translateX(-50%);
        }

        #claw {
            position: absolute;
            bottom: -30px;
            left: 50%;
            width: 54px;
            height: 40px;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
        }

        .claw-arm {
            width: 12px;
            height: 35px;
            background: linear-gradient(to bottom, #aaa, #666);
            border-radius: 6px;
            transition: transform 0.2s;
            border: 1px solid #444;
        }

        .claw-arm.left { transform: rotate(15deg); transform-origin: top right; }
        .claw-arm.right { transform: rotate(-15deg); transform-origin: top left; }

        .claw-grabbing .claw-arm.left { transform: rotate(-15deg); }
        .claw-grabbing .claw-arm.right { transform: rotate(15deg); }

        /* Bottles */
        .bottle {
            position: absolute;
            width: 25px;
            height: 60px;
            bottom: 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
        }
        .bottle::before {
            display: none;
        }

        .lemon { background-image: url('assets/images/chinazeslimon04-481x1024.png'); }
        .pear { background-image: url('assets/images/chinazesgrusha04-481x1024.png'); }
        .cherry { background-image: url('assets/images/chinazesvishnja04-481x1024.png'); }
        .empty {
            background-image: url('assets/images/chinazeslimon04-481x1024.png');
            filter: grayscale(1);
        }

        /* Cactus Sheriff */
        #cactus-sheriff {
            position: absolute;
            bottom: 120px; /* Aligned with machine base */
            left: -10px;
            width: 150px;
            height: 150px;
            z-index: 60;
            pointer-events: none;
            background-image: url('assets/images/character.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom left;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.5));
        }

        .sheriff-lever {
            position: absolute;
            bottom: 45px;
            left: 100px;
            width: 6px;
            height: 45px;
            background: #222;
            transform-origin: bottom center;
            transition: transform 0.3s;
            border-radius: 3px;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .lever-handle {
            position: absolute;
            top: -15px;
            left: -11px;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #e74c3c, #c0392b);
            border-radius: 50%;
            border: 2px solid #96281b;
        }
        .lever-pulled {
            transform: rotate(40deg);
        }

        /* Controls */
        #controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 5px solid #222;
        }

        #grab-btn {
            width: 200px;
            height: 80px;
            border-radius: 40px;
            background: #c0392b;
            box-shadow: 0 8px #96281b;
        }
        #grab-btn:active {
            box-shadow: 0 2px #96281b;
        }

        .hidden { display: none !important; }

        /* Animation for grabbing */
        @keyframes sway {
            0% { transform: rotate(-1deg); }
            100% { transform: rotate(1deg); }
        }
        #claw-carriage { animation: sway 1s infinite alternate ease-in-out; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>ЧИНАЗЕС ХВАТАЙКА</h1>
            <p>Собери все редкие вкусы!</p>

            <div class="flavor-guide">
                <div class="flavor-item">
                    <div class="flavor-icon lemon"></div>
                    <span>10</span>
                </div>
                <div class="flavor-item">
                    <div class="flavor-icon pear"></div>
                    <span>15</span>
                </div>
                <div class="flavor-item">
                    <div class="flavor-icon cherry"></div>
                    <span>25</span>
                </div>
                <div class="flavor-item">
                    <div class="flavor-icon empty"></div>
                    <span>2</span>
                </div>
            </div>

            <button id="start-btn">ИГРАТЬ</button>
            <p style="margin-top: 20px; font-size: 1rem;">РЕКОРД: <span class="high-score-val">0</span></p>
        </div>

        <!-- Game Screen -->
        <div id="game-screen">
            <div id="score-board">
            <div>ВРЕМЯ: <span id="timer">30</span></div>
                <div>СЧЕТ: <span id="current-score">0</span></div>
                <div>РЕКОРД: <span id="high-score">0</span></div>
            </div>

            <div id="machine-area">
                <div id="claw-carriage">
                    <div id="claw-rope"></div>
                    <div id="claw">
                        <div class="claw-arm left"></div>
                        <div class="claw-arm right"></div>
                    </div>
                </div>
                <div id="bottles-container"></div>
            </div>

            <div id="cactus-sheriff">
                <div class="sheriff-lever">
                    <div class="lever-handle"></div>
                </div>
            </div>

            <div id="controls">
                <button id="grab-btn">ХВАТАЙ!</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1>ИГРА ОКОНЧЕНА</h1>
            <div id="stats">
                <p>Собрано бутылок: <span id="bottles-collected">0</span></p>
                <p>Итоговый счет: <span id="final-score">0</span></p>
            </div>
            <button id="restart-btn">ПОПРОБОВАТЬ СНОВА</button>
        </div>
    </div>
    <script>
        const gameContainer = document.getElementById('game-container');
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const grabBtn = document.getElementById('grab-btn');

        const carriage = document.getElementById('claw-carriage');
        const rope = document.getElementById('claw-rope');
        const claw = document.getElementById('claw');
        const bottlesContainer = document.getElementById('bottles-container');
        const timerEl = document.getElementById('timer');
        const currentScoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const finalScoreEl = document.getElementById('final-score');
        const bottlesCollectedEl = document.getElementById('bottles-collected');

        let score = 0;
        let highScore = parseInt(localStorage.getItem('chinazes_highscore')) || 0;
        let collectedCount = 0;
        let isGameOver = false;
        let isGrabbing = false;
        let clawPos = { x: 50, y: 0 }; // x in %, y in pixels
        let clawDirection = 1; // 1 for right, -1 for left
        let carriageSpeed = 0.8;
        let gameActive = false;
        let timeLeft = 30;
        let gameTimer;

        highScoreEl.textContent = highScore;
        document.querySelectorAll('.high-score-val').forEach(el => el.textContent = highScore);

        const bottleTypes = [
            { type: 'lemon', points: 10, weight: 3 },
            { type: 'pear', points: 15, weight: 2 },
            { type: 'cherry', points: 25, weight: 1 },
            { type: 'empty', points: 2, weight: 4 }
        ];

        function getRandomType() {
            const totalWeight = bottleTypes.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            for (const item of bottleTypes) {
                if (random < item.weight) return item;
                random -= item.weight;
            }
            return bottleTypes[0];
        }

        function initGame() {
            score = 0;
            collectedCount = 0;
            timeLeft = 30;
            isGameOver = false;
            isGrabbing = false;
            clawPos = { x: 50, y: 0 };
            currentScoreEl.textContent = score;
            timerEl.textContent = timeLeft;
            bottlesContainer.innerHTML = '';
            spawnBottles();
            gameActive = true;

            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;

                if (timeLeft <= 10) {
                    timerEl.parentElement.classList.add('timer-low');
                } else {
                    timerEl.parentElement.classList.remove('timer-low');
                }

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameActive = false;
            isGameOver = true;
            clearInterval(gameTimer);

            finalScoreEl.textContent = score;
            bottlesCollectedEl.textContent = collectedCount;
            gameOverScreen.classList.remove('hidden');
        }

        function spawnBottles() {
            const count = 10;
            for (let i = 0; i < count; i++) {
                createBottle();
            }
        }

        function createBottle() {
            const bottle = document.createElement('div');
            const typeInfo = getRandomType();
            bottle.className = `bottle ${typeInfo.type}`;
            bottle.dataset.points = typeInfo.points;
            bottle.dataset.type = typeInfo.type;

            let x;
            let overlapping = true;
            let attempts = 0;
            while(overlapping && attempts < 15) {
                x = Math.random() * 85 + 5;
                overlapping = Array.from(bottlesContainer.children).some(b => {
                    return Math.abs(parseFloat(b.style.left) - x) < 8;
                });
                attempts++;
            }

            bottle.style.left = `${x}%`;
            bottle.style.bottom = `${Math.random() * 8}px`;
            bottle.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;

            bottlesContainer.appendChild(bottle);
        }

        function gameLoop() {
            if (!gameActive || isGameOver) return;

            if (!isGrabbing) {
                // Horizontal movement
                clawPos.x += clawDirection * carriageSpeed;
                if (clawPos.x >= 95 || clawPos.x <= 5) {
                    clawDirection *= -1;
                }
                carriage.style.left = `${clawPos.x}%`;
            }

            requestAnimationFrame(gameLoop);
        }

        function grab() {
            if (isGrabbing || !gameActive || isGameOver) return;
            isGrabbing = true;

            const lever = document.querySelector('.sheriff-lever');
            lever.classList.add('lever-pulled');
            setTimeout(() => lever.classList.remove('lever-pulled'), 500);

            const maxDepth = gameScreen.offsetHeight - 180; // Distance to bottom
            let currentDepth = 0;
            let descending = true;
            let paused = false;
            let retractSpeed = 4;

            claw.classList.add('claw-grabbing');

            const grabInterval = setInterval(() => {
                if (paused) return;

                if (descending) {
                    currentDepth += 7;
                    if (currentDepth >= maxDepth) {
                        currentDepth = maxDepth;
                        paused = true;
                        checkCollision();

                        // If empty bottle, it's heavy!
                        const attached = claw.querySelector('.bottle');
                        if (attached && attached.dataset.type === 'empty') {
                            retractSpeed = 2;
                        } else {
                            retractSpeed = 5;
                        }

                        setTimeout(() => {
                            descending = false;
                            paused = false;
                        }, 400);
                    }
                } else {
                    currentDepth -= retractSpeed;
                    if (currentDepth <= 0) {
                        currentDepth = 0;
                        clearInterval(grabInterval);
                        isGrabbing = false;
                        claw.classList.remove('claw-grabbing');

                        const attachedBottle = claw.querySelector('.bottle');
                        if (attachedBottle) {
                            collectBottle(attachedBottle);
                        }
                    }
                }

                rope.style.height = `${currentDepth}px`;
                claw.style.bottom = `${-30 - currentDepth}px`;
            }, 20);
        }

        function checkCollision() {
            const clawRect = claw.getBoundingClientRect();
            const bottles = bottlesContainer.querySelectorAll('.bottle');

            // Expand hit area slightly for better UX
            const hitPadding = 15;

            for (let bottle of bottles) {
                const bottleRect = bottle.getBoundingClientRect();

                if (!(clawRect.right + hitPadding < bottleRect.left ||
                      clawRect.left - hitPadding > bottleRect.right ||
                      clawRect.bottom < bottleRect.top ||
                      clawRect.top > bottleRect.bottom)) {

                    // Attach to claw
                    bottle.style.left = '50%';
                    bottle.style.bottom = '-40px';
                    bottle.style.transform = 'translateX(-50%)';
                    claw.appendChild(bottle);
                    break;
                }
            }
        }

        function collectBottle(bottle) {
            const points = parseInt(bottle.dataset.points);
            score += points;
            collectedCount++;
            currentScoreEl.textContent = score;

            // Show point popup
            const popup = document.createElement('div');
            popup.className = 'point-popup';
            popup.textContent = `+${points}`;
            popup.style.left = `${clawPos.x}%`;
            popup.style.top = '100px';
            gameScreen.appendChild(popup);
            setTimeout(() => popup.remove(), 1000);

            // Sheriff excitement!
            const sheriff = document.getElementById('cactus-sheriff');
            sheriff.style.transform = 'scale(1.1) rotate(5deg)';
            setTimeout(() => sheriff.style.transform = 'scale(1) rotate(0deg)', 300);

            bottle.remove();
            createBottle(); // Respawn a new one

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('chinazes_highscore', highScore);
                highScoreEl.textContent = highScore;
                document.querySelectorAll('.high-score-val').forEach(el => el.textContent = highScore);
            }
        }

        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            initGame();
        });

        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            initGame();
        });

        grabBtn.addEventListener('click', grab);

        // Touch events for mobile
        grabBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            grab();
        });

    </script>
</body>
</html>
