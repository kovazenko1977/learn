<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-запись | Dental CRM</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4 sm:p-8">
    <div id="app" class="max-w-xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="bg-blue-600 p-8 text-white">
            <h1 class="text-2xl font-black">Запись на прием</h1>
            <p class="opacity-80">Выберите удобное время для визита</p>
        </div>

        <div class="p-8 space-y-6">
            <div v-if="success" class="text-center py-10">
                <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-xl font-bold mb-2">Заявка принята!</h2>
                <p class="text-gray-500">Мы свяжемся с вами для подтверждения.</p>
                <button @click="success = false; form = {}" class="mt-6 text-blue-600 font-bold">Записаться еще раз</button>
            </div>

            <form v-else @submit.prevent="submit" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">ФИО</label>
                    <input v-model="form.full_name" required class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Телефон</label>
                        <input v-model="form.phone" required placeholder="+7..." class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Email</label>
                        <input v-model="form.email" type="email" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Услуга</label>
                    <select v-model="form.service_id" required class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Выберите услугу</option>
                        <option v-for="s in services" :value="s.id">{{ s.name }} ({{ s.duration_minutes }} мин)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Врач (необязательно)</label>
                    <select v-model="form.doctor_id" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Любой свободный</option>
                        <option v-for="d in doctors" :value="d.id">{{ d.full_name }} - {{ d.specialization }}</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Дата</label>
                        <input v-model="form.date" type="date" required :min="minDate" class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Желаемое время</label>
                        <input v-model="form.time_start" type="time" required class="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <p v-if="error" class="text-red-500 text-sm font-medium">{{ error }}</p>

                <button type="submit" :disabled="loading" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black shadow-xl shadow-blue-200 hover:bg-blue-700 transition disabled:opacity-50">
                    {{ loading ? 'Отправка...' : 'Записаться' }}
                </button>
            </form>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    form: { service_id: '', doctor_id: '', date: '', time_start: '' },
                    services: [],
                    doctors: [],
                    loading: false,
                    success: false,
                    error: '',
                    minDate: new Date().toISOString().split('T')[0]
                }
            },
            async mounted() {
                const [sRes, dRes] = await Promise.all([
                    fetch('api/index.php?module=online_booking&action=get_services'),
                    fetch('api/index.php?module=online_booking&action=get_doctors')
                ]);
                this.services = await sRes.json();
                this.doctors = await dRes.json();
            },
            methods: {
                async submit() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const res = await fetch('api/index.php?module=online_booking&action=submit', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.form)
                        });
                        const result = await res.json();
                        if (result.success) {
                            this.success = true;
                        } else {
                            this.error = result.error || 'Ошибка при записи';
                        }
                    } catch (e) {
                        this.error = 'Ошибка соединения';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
