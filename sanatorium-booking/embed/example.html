<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Внедрение бронирования</title>
</head>
<body>
    <h1>Наш партнерский сайт</h1>
    <p>Вы можете забронировать номер прямо здесь:</p>

    <!-- Контейнер для формы -->
    <div id="booking-widget"></div>

    <!-- Скрипт загрузчика -->
    <script src="booking-loader.js" data-container="booking-widget"></script>

    <hr>
    <h3>Как встроить?</h3>
    <pre>
&lt;div id="sanatorium-booking-root"&gt;&lt;/div&gt;
&lt;script src="http://your-domain.com/sanatorium-booking/embed/booking-loader.js" data-container="sanatorium-booking-root"&gt;&lt;/script&gt;
    </pre>
</body>
</html>
